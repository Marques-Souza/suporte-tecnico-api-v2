spring:
  application:
    name: suporte-tecnico-api-v2

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 30
  initialization:
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}

server:
  error:
    include-stacktrace: never