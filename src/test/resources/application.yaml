spring:
  application:
    name: suporte-tecnico-api-v2

  datasource:
    url: jdbc:postgresql://localhost:5432/suporte_api_test
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    jwt:
      secret: test-only-jwt-secret-must-have-at-least-32-characters
      expiration-minutes: 30
  initialization:
    admin:
      email: admin@gmail.com
      password: admin123

server:
  error:
    include-stacktrace: never