name: Suporte Tecnico API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Tests & Package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: suporte_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package JAR
        env:
          DB_URL: jdbc:postgresql://localhost:5432/suporte_api_test
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
          ADMIN_EMAIL: admin@demo.com
          ADMIN_PASSWORD: demo-admin-123
        run: ./mvnw clean package

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: suporte-tecnico-api-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t suporte-tecnico-api:ci-test .